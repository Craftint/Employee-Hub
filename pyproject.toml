[project]
name = "employee_hub"
authors = [
    { name = "Sebin P Sabu", email = "sebin.freelance@gmail.com" }
]
description = "Personalized Employee Self-Service Hub for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe -- https://github.com/frappe/frappe is installed via 'bench init'
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "UP031",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
